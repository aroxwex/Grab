name: Build Grab

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "8.0.x"

      - name: Publish (single file, self-contained)
        run: >
          dotnet publish src/Grab/Grab.csproj -c Release -r win-x64 --self-contained true
          -p:PublishSingleFile=true -p:IncludeNativeLibrariesForSelfExtract=true
          -p:EnableCompressionInSingleFile=true -o dist/Grab

      - name: Download yt-dlp, ffmpeg and QuickJS
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force dist/Grab/bin | Out-Null
          $retry = @{ MaximumRetryCount = 3; RetryIntervalSec = 5 }

          # yt-dlp nightly: YouTube changes often and fixes land here first
          Invoke-WebRequest @retry "https://github.com/yt-dlp/yt-dlp-nightly-builds/releases/latest/download/yt-dlp.exe" -OutFile dist/Grab/bin/yt-dlp.exe

          # ffmpeg "essentials" build (smaller than the full builds), only ffmpeg and ffprobe are kept
          Invoke-WebRequest @retry "https://www.gyan.dev/ffmpeg/builds/ffmpeg-release-essentials.zip" -OutFile ffmpeg.zip
          Expand-Archive ffmpeg.zip -DestinationPath ffmpeg-tmp
          Copy-Item ffmpeg-tmp/*/bin/ffmpeg.exe dist/Grab/bin/
          Copy-Item ffmpeg-tmp/*/bin/ffprobe.exe dist/Grab/bin/

          # QuickJS (about 2 MB) is the small JavaScript engine yt-dlp needs for YouTube
          Invoke-WebRequest @retry "https://github.com/quickjs-ng/quickjs/releases/latest/download/qjs-windows-x86_64.exe" -OutFile dist/Grab/bin/qjs.exe

      # The artifact is "dist", so the downloaded zip contains the Grab folder:
      #   Grab/Grab.exe
      #   Grab/bin/...
      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: Grab-portable
          path: dist

      # Compress-Archive on the folder itself keeps "Grab/" as the top-level folder inside the zip.
      - name: Zip (tagged releases only)
        if: startsWith(github.ref, 'refs/tags/')
        shell: pwsh
        run: Compress-Archive -Path dist/Grab -DestinationPath Grab-portable.zip

      - name: Create release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: Grab-portable.zip
